name: CI

# Runs on every push and PR to any branch. This is the gate the deploy
# workflows wait on — nothing reaches staging or production without it passing.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install API dependencies
        # Same dependency set the deployed image uses, so CI catches a missing
        # package before it becomes a container that won't boot.
        run: pip install -r requirements-api.txt

      - name: Run unit tests
        # No secrets needed: the suite stubs out RAGService and never calls
        # OpenAI or Qdrant.
        run: python -m unittest discover -s tests -v

      - name: Verify every module imports
        # Import errors (bad names, missing deps) otherwise only surface at
        # container start, long after the image is built and pushed.
        run: |
          python -c "import APP.main" && echo "APP.main imports OK"

  frontend-checks:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        # Proves the export actually succeeds before we try to deploy it.
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          BASE_PATH: ''

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
