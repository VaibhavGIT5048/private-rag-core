name: Deploy backend to Azure

# Branch → environment mapping:
#   develop → dev/staging (rag-api-staging) — deploys automatically
#   main    → production  (rag-api)         — MANUAL ONLY
#
# Production is deliberately not on the push trigger. Merging to main used to
# ship straight to the live app, which left no gap to exercise a change on the
# dev environment first. Promote with:
#   Actions → "Deploy backend to Azure" → Run workflow → target: production
# (or `gh workflow run deploy-backend.yml -f target=production`).
#
# Both paths run the full test suite first; a failing test blocks the deploy.

on:
  push:
    branches: [develop]
    paths:
      - 'APP/**'
      - 'docker/Dockerfile.api'
      - 'requirements-api.txt'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which environment to deploy'
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vaibhavgit5048/private-rag-core-api
  RESOURCE_GROUP: rag-api-rg

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: pip install -r requirements-api.txt
      - run: python -m unittest discover -s tests -v
      - run: python -c "import APP.main"

  resolve:
    name: Resolve target environment
    runs-on: ubuntu-latest
    needs: test
    outputs:
      env_name: ${{ steps.pick.outputs.env_name }}
      app_name: ${{ steps.pick.outputs.app_name }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="production"
          else
            TARGET="staging"
          fi

          if [ "$TARGET" = "production" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "app_name=rag-api"    >> $GITHUB_OUTPUT
            echo "tag=latest"          >> $GITHUB_OUTPUT
          else
            echo "env_name=staging"        >> $GITHUB_OUTPUT
            echo "app_name=rag-api-staging" >> $GITHUB_OUTPUT
            echo "tag=staging"             >> $GITHUB_OUTPUT
          fi
          echo "Deploying to $TARGET"

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          # The immutable :sha tag is what actually gets deployed, so a rollback
          # is just re-pointing the app at an older sha.
          tags: |
            ${{ env.IMAGE }}:${{ needs.resolve.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}
          # Registry cache rather than type=gha. The image now carries a ~2.3GB
          # baked-model layer on top of torch, and GitHub's Actions cache is
          # capped near 10GB per repo with LRU eviction — under mode=max that
          # thrashes, the model layer gets evicted, and every build re-downloads
          # the weights, defeating the bake. GHCR has no such cap and already
          # hosts the image being pushed.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    name: Deploy to ${{ needs.resolve.outputs.env_name }}
    runs-on: ubuntu-latest
    needs: [resolve, build]
    # Attach to a GitHub Environment so production can require manual approval
    # (Settings → Environments → production → required reviewers).
    environment:
      name: ${{ needs.resolve.outputs.env_name }}
      url: ${{ steps.url.outputs.app_url }}
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy image to Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ needs.resolve.outputs.app_name }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.IMAGE }}:${{ github.sha }}

      - name: Get app URL
        id: url
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            FQDN=$(az containerapp show \
              --name ${{ needs.resolve.outputs.app_name }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn -o tsv)
            echo "app_url=https://$FQDN" >> $GITHUB_OUTPUT
            echo "Deployed to https://$FQDN"

      - name: Smoke test the deployment
        # Fails the workflow if the new revision doesn't actually come up
        # healthy — a green deploy step alone doesn't prove the app works.
        run: |
          URL="${{ steps.url.outputs.app_url }}"
          echo "Waiting for $URL/health ..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$URL/health" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Healthy after ${i} attempt(s):"
              cat /tmp/health.json
              # status can be "degraded" (HTTP 200) if a dependency is down —
              # treat that as a failed deploy, not a success.
              grep -q '"status":"ok"' /tmp/health.json || {
                echo "::error::Backend responded but is degraded"; exit 1; }
              exit 0
            fi
            echo "  attempt $i: HTTP $CODE (cold start can take ~60s)"
            sleep 10
          done
          echo "::error::Health check never returned 200"
          exit 1
